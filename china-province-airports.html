<title>中国省份机场地图</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap">

<style>
  :root {
    --bg: #F4F6FB;
    --bg-soft: #ECEEF6;
    --surface: #FFFFFF;
    --border: #DDE1EC;
    --border-soft: #E7E9F2;
    --text: #171B29;
    --text-muted: #5B6172;
    --text-faint: #8890A2;
    --accent: #3652E0;
    --accent-strong: #2740C4;
    --accent-soft: #E8ECFF;
    --accent-2: #D98A2B;
    --success: #10B981;
    --warning: #F59E0B;
    --danger: #EF4444;
    --ocean: #C8DCEE;
    --land-empty: #D6DDE8;
    --shadow: 0 1px 3px rgba(23,27,41,.05), 0 8px 24px -12px rgba(23,27,41,.12);
    --r: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A0E1A; --bg-soft: #101527; --surface: #121729;
      --border: #232B42; --border-soft: #1B2136;
      --text: #E8EAF3; --text-muted: #A5ABC0; --text-faint: #6C7288;
      --accent: #6E8BFF; --accent-strong: #8CA3FF; --accent-soft: #1B2450;
      --accent-2: #F0B65C;
      --success: #34D399; --warning: #FBBF24; --danger: #F87171;
      --ocean: #162236; --land-empty: #1E2640;
      --shadow: 0 1px 3px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A0E1A; --bg-soft: #101527; --surface: #121729;
    --border: #232B42; --border-soft: #1B2136;
    --text: #E8EAF3; --text-muted: #A5ABC0; --text-faint: #6C7288;
    --accent: #6E8BFF; --accent-strong: #8CA3FF; --accent-soft: #1B2450;
    --accent-2: #F0B65C;
    --success: #34D399; --warning: #FBBF24; --danger: #F87171;
    --ocean: #162236; --land-empty: #1E2640;
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.5);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Noto Sans SC', "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .page { max-width: 1400px; margin: 0 auto; padding: 28px 24px 60px; }

  .header { margin-bottom: 24px; }
  .header h1 { font-family: 'ZCOOL XiaoWei', serif; font-size: 28px; font-weight: 400; margin: 0 0 6px; }
  .header p { margin: 0; font-size: 14px; color: var(--text-muted); }

  .layout { display: grid; grid-template-columns: 1fr 380px; gap: 20px; align-items: start; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }

  .map-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); box-shadow: var(--shadow); padding: 16px;
  }
  .map-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; gap: 8px; flex-wrap: wrap;
  }
  .map-toolbar h2 { font-size: 14px; font-weight: 600; color: var(--text-muted); margin: 0; }
  .toolbar-actions { display: flex; gap: 8px; }
  .btn {
    font-size: 12px; font-family: inherit; padding: 6px 14px;
    border-radius: 6px; cursor: pointer; font-weight: 600;
    border: 1px solid var(--border); background: var(--bg-soft);
    color: var(--text-muted); transition: all .12s;
  }
  .btn:hover { background: var(--border); color: var(--text); }

  svg.chinamap { width: 100%; height: auto; display: block; border-radius: 6px; }
  svg.chinamap .ocean { fill: var(--ocean); }
  svg.chinamap path.prov {
    fill: var(--land-empty);
    stroke: color-mix(in srgb, var(--ocean) 50%, var(--surface));
    stroke-width: 1.0;
    cursor: pointer;
    transition: all .15s ease;
  }
  svg.chinamap path.prov:hover {
    filter: drop-shadow(0 1px 4px rgba(0,0,0,.3)) brightness(1.05);
    stroke: rgba(255,255,255,.65);
    stroke-width: 1.4;
  }
  svg.chinamap path.prov.selected {
    fill: var(--accent);
    stroke: rgba(255,255,255,.7);
    stroke-width: 1.4;
  }
  svg.chinamap path.prov.has-data {
    fill: color-mix(in srgb, var(--accent) 15%, var(--land-empty));
  }
  svg.chinamap path.prov.has-data:hover {
    fill: color-mix(in srgb, var(--accent) 25%, var(--land-empty));
  }
  svg.chinamap text.provlabel {
    font-size: 9px; fill: var(--text); opacity: .55;
    pointer-events: none;
    font-family: 'Noto Sans SC', sans-serif;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .side { display: flex; flex-direction: column; gap: 16px; }

  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); box-shadow: var(--shadow); padding: 16px;
  }
  .panel-title {
    font-size: 13px; font-weight: 700; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px;
  }

  /* airport list panel */
  .airport-panel { max-height: 800px; overflow-y: auto; }
  .airport-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 60px 16px; color: var(--text-faint); text-align: center; gap: 12px;
  }
  .airport-empty-icon { font-size: 42px; opacity: .3; }
  .airport-empty p { margin: 0; font-size: 13px; line-height: 1.6; }

  .airport-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border-soft);
  }
  .airport-prov-name { font-size: 18px; font-weight: 700; color: var(--text); font-family: 'ZCOOL XiaoWei', serif; }
  .airport-count { font-size: 12px; color: var(--text-faint); background: var(--bg-soft); padding: 4px 10px; border-radius: 12px; }

  .airport-list { display: flex; flex-direction: column; gap: 12px; }
  .airport-card {
    background: var(--bg-soft); border: 1px solid var(--border-soft);
    border-radius: 8px; padding: 14px; cursor: pointer;
    transition: all .12s; text-decoration: none; color: inherit;
  }
  .airport-card:hover {
    background: var(--surface); border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    transform: translateY(-1px);
  }

  .airport-card-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
  }
  .airport-logo {
    width: 40px; height: 40px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border);
    flex-shrink: 0; object-fit: cover;
  }
  .airport-name-group { flex: 1; min-width: 0; }
  .airport-name {
    font-size: 15px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .airport-tier {
    display: inline-block; font-size: 11px; padding: 2px 8px;
    border-radius: 10px; margin-top: 2px; font-weight: 600;
  }
  .airport-tier.tier-高端 { background: #FEF3C7; color: #B45309; }
  .airport-tier.tier-中端 { background: #DBEAFE; color: #1E40AF; }
  .airport-tier.tier-入门 { background: #E0E7FF; color: #4338CA; }

  .airport-stats {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    font-size: 12px; color: var(--text-muted);
  }
  .airport-stat {
    display: flex; align-items: center; gap: 6px;
  }
  .airport-stat-icon { opacity: .6; }
  .airport-stat-value { font-weight: 600; color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .airport-stat-unit { font-size: 11px; }

  .airport-tags {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
  }
  .airport-tag {
    font-size: 11px; padding: 3px 8px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent); font-weight: 500;
  }

  .airport-price {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-soft);
    display: flex; align-items: center; justify-content: space-between;
  }
  .airport-price-label { font-size: 11px; color: var(--text-faint); }
  .airport-price-value {
    font-size: 18px; font-weight: 700; color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .airport-price-value span { font-size: 12px; font-weight: 500; }

  .legend {
    display: flex; align-items: center; gap: 16px; padding: 12px;
    background: var(--bg-soft); border-radius: 8px; font-size: 12px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
  }
  .legend-color {
    width: 20px; height: 12px; border-radius: 3px; border: 1px solid var(--border);
  }

  /* ISP speed test panels */
  .isp-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); box-shadow: var(--shadow); padding: 16px;
  }
  .isp-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border-soft);
  }
  .isp-icon {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .isp-icon.mobile { background: #FEF3C7; }
  .isp-icon.unicom { background: #DBEAFE; }
  .isp-icon.telecom { background: #D1FAE5; }
  .isp-title { font-size: 16px; font-weight: 700; flex: 1; }
  .isp-empty {
    text-align: center; padding: 32px 16px;
    color: var(--text-faint); font-size: 13px;
  }
  .isp-stats {
    display: grid; gap: 10px;
  }
  .isp-stat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; background: var(--bg-soft); border-radius: 6px;
  }
  .isp-stat-label { font-size: 13px; color: var(--text-muted); }
  .isp-stat-value {
    font-size: 18px; font-weight: 700; color: var(--text);
    font-family: 'JetBrains Mono', monospace;
  }
  .isp-stat-value span { font-size: 12px; font-weight: 500; color: var(--text-muted); }
  .isp-stat-bar {
    margin-top: 6px; height: 4px; background: var(--border-soft);
    border-radius: 2px; overflow: hidden;
  }
  .isp-stat-bar-fill {
    height: 100%; border-radius: 2px; transition: width .3s ease;
  }
  .isp-stat-bar-fill.mobile { background: #F59E0B; }
  .isp-stat-bar-fill.unicom { background: #3B82F6; }
  .isp-stat-bar-fill.telecom { background: #10B981; }


.footer {
  background: var(--surface);
  border-top: 1px solid var(--border);
  margin-top: 80px;
}

.footer-content {
  max-width: 1400px;
  margin: 0 auto;
  padding: 60px 24px 40px;
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 40px;
}

.footer-section h4 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 16px;
}

.footer-brand .footer-logo {
  font-size: 24px;
  margin-bottom: 12px;
  font-family: 'Noto Sans SC', sans-serif;
}

.footer-desc {
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1.6;
  max-width: 400px;
}

.footer-links {
  list-style: none;
  padding: 0;
  margin: 0;
}

.footer-links li {
  margin-bottom: 12px;
}

.footer-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 14px;
  transition: color 0.2s;
}

.footer-links a:hover {
  color: var(--accent);
}

.footer-bottom {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px 24px 32px;
  border-top: 1px solid var(--border-soft);
}

.footer-disclaimer {
  margin-bottom: 20px;
}

.footer-disclaimer p {
  color: var(--text-faint);
  font-size: 13px;
  line-height: 1.6;
}

.footer-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.footer-meta p {
  color: var(--text-muted);
  font-size: 14px;
  margin: 0;
}

.footer-meta a {
  color: var(--accent);
  text-decoration: none;
  transition: color 0.2s;
}

.footer-meta a:hover {
  color: var(--accent-strong);
}

@media (max-width: 1024px) {
  .footer-content {
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }
}

@media (max-width: 640px) {
  .footer-content {
    grid-template-columns: 1fr;
    gap: 32px;
  }

  .footer-meta {
    flex-direction: column;
    align-items: flex-start;
  }
}

<script>
const PROVINCES = {
  '110000': '北京市', '310000': '上海市', '320000': '江苏省', '330000': '浙江省',
  '370000': '山东省', '440000': '广东省'
  // 其他省份...
};

let airportsData = [];
let activeCode = null;

// Load airports data
fetch('data/airports.json')
  .then(res => res.json())
  .then(data => {
    airportsData = data;
    updateMapDataIndicators();
  })
  .catch(err => console.error('Failed to load airports data:', err));

function updateMapDataIndicators() {
  const provinceSet = new Set();
  airportsData.forEach(airport => {
    Object.keys(airport.provinces || {}).forEach(code => provinceSet.add(code));
  });

  document.querySelectorAll('path.prov').forEach(path => {
    const code = path.dataset.adcode;
    if (provinceSet.has(code)) {
      path.classList.add('has-data');
    }
  });
}

function showAirports(code) {
  const provName = PROVINCES[code] || '未知省份';

  // Highlight SVG
  document.querySelectorAll('path.prov').forEach(path => {
    path.classList.toggle('selected', path.dataset.adcode === code);
  });

  activeCode = code;

  // Filter airports with nodes in this province
  const airportsInProvince = airportsData.filter(airport =>
    airport.provinces && airport.provinces[code]
  );

  if (airportsInProvince.length === 0) {
    document.getElementById('airportEmpty').style.display = 'flex';
    document.getElementById('airportContent').style.display = 'none';
  } else {
    document.getElementById('airportEmpty').style.display = 'none';
    document.getElementById('airportContent').style.display = '';
    document.getElementById('airportProvName').textContent = provName;
    document.getElementById('airportCount').textContent = `${airportsInProvince.length} 个机场`;

    // Render airport cards
    const listHTML = airportsInProvince.map(airport => {
      const provData = airport.provinces[code];
      return `
        <a class="airport-card" href="airport-detail.html?id=${airport.id}" target="_blank">
          <div class="airport-card-header">
            <img class="airport-logo" src="${airport.logo}" alt="${airport.name}">
            <div class="airport-name-group">
              <div class="airport-name">${airport.name}</div>
              <span class="airport-tier tier-${airport.tier}">${airport.tier}</span>
            </div>
          </div>

          <div class="airport-stats">
            <div class="airport-stat">
              <span class="airport-stat-icon">📍</span>
              <span class="airport-stat-value">${provData.nodeCount}</span>
              <span class="airport-stat-unit">节点</span>
            </div>
            <div class="airport-stat">
              <span class="airport-stat-icon">⚡</span>
              <span class="airport-stat-value">${provData.avgSpeed}</span>
              <span class="airport-stat-unit">Mbps</span>
            </div>
            <div class="airport-stat">
              <span class="airport-stat-icon">⏱</span>
              <span class="airport-stat-value">${provData.avgLatency}</span>
              <span class="airport-stat-unit">ms</span>
            </div>
            <div class="airport-stat">
              <span class="airport-stat-icon">✓</span>
              <span class="airport-stat-value">${provData.stability}</span>
              <span class="airport-stat-unit">%</span>
            </div>
          </div>

          ${airport.tags && airport.tags.length > 0 ? `
            <div class="airport-tags">
              ${airport.tags.map(tag => `<span class="airport-tag">${tag}</span>`).join('')}
            </div>
          ` : ''}

          <div class="airport-price">
            <span class="airport-price-label">起步价</span>
            <span class="airport-price-value">¥${airport.price.monthly}<span>/月</span></span>
          </div>
        </a>
      `;
    }).join('');

    document.getElementById('airportList').innerHTML = listHTML;
  }

  // Show ISP speed test data
  showISPData(code, provName);
}

function showISPData(code, provName) {
  // Calculate average ISP speeds from all airports in this province
  const airportsInProvince = airportsData.filter(airport =>
    airport.provinces && airport.provinces[code]
  );

  if (airportsInProvince.length === 0) {
    // Hide ISP data
    document.getElementById('ispMobileEmpty').style.display = '';
    document.getElementById('ispMobileContent').style.display = 'none';
    document.getElementById('ispUnicomEmpty').style.display = '';
    document.getElementById('ispUnicomContent').style.display = 'none';
    document.getElementById('ispTelecomEmpty').style.display = '';
    document.getElementById('ispTelecomContent').style.display = 'none';
    return;
  }

  // Mock ISP data based on airport speeds (in real app, this would come from actual ISP tests)
  let totalSpeed = 0;
  let totalLatency = 0;
  let count = 0;

  airportsInProvince.forEach(airport => {
    const provData = airport.provinces[code];
    totalSpeed += provData.avgSpeed;
    totalLatency += provData.avgLatency;
    count++;
  });

  const avgSpeed = Math.round(totalSpeed / count);
  const avgLatency = Math.round(totalLatency / count);

  // Simulate different ISP performance (Mobile slightly slower, Unicom balanced, Telecom faster)
  const mobileSpeed = Math.round(avgSpeed * 0.85);
  const mobileLatency = Math.round(avgLatency * 1.15);
  const unicomSpeed = Math.round(avgSpeed * 0.95);
  const unicomLatency = Math.round(avgLatency * 1.05);
  const telecomSpeed = Math.round(avgSpeed * 1.05);
  const telecomLatency = Math.round(avgLatency * 0.95);

  // Update titles
  document.getElementById('ispMobileTitle').textContent = `${provName}移动测速`;
  document.getElementById('ispUnicomTitle').textContent = `${provName}联通测速`;
  document.getElementById('ispTelecomTitle').textContent = `${provName}电信测速`;

  // Show Mobile data
  document.getElementById('ispMobileEmpty').style.display = 'none';
  document.getElementById('ispMobileContent').style.display = '';
  document.getElementById('mobileSpeed').textContent = mobileSpeed;
  document.getElementById('mobileLatency').textContent = mobileLatency;
  document.getElementById('mobileSpeedBar').style.width = Math.min(100, (mobileSpeed / 1000) * 100) + '%';

  // Show Unicom data
  document.getElementById('ispUnicomEmpty').style.display = 'none';
  document.getElementById('ispUnicomContent').style.display = '';
  document.getElementById('unicomSpeed').textContent = unicomSpeed;
  document.getElementById('unicomLatency').textContent = unicomLatency;
  document.getElementById('unicomSpeedBar').style.width = Math.min(100, (unicomSpeed / 1000) * 100) + '%';

  // Show Telecom data
  document.getElementById('ispTelecomEmpty').style.display = 'none';
  document.getElementById('ispTelecomContent').style.display = '';
  document.getElementById('telecomSpeed').textContent = telecomSpeed;
  document.getElementById('telecomLatency').textContent = telecomLatency;
  document.getElementById('telecomSpeedBar').style.width = Math.min(100, (telecomSpeed / 1000) * 100) + '%';
}

// SVG click handler
document.getElementById('chinamap').addEventListener('click', e => {
  const path = e.target.closest('path.prov');
  if (!path) return;
  showAirports(path.dataset.adcode);
});

// Clear button
document.getElementById('btnClear').addEventListener('click', () => {
  document.querySelectorAll('path.prov').forEach(p => p.classList.remove('selected'));
  activeCode = null;
  document.getElementById('airportEmpty').style.display = 'flex';
  document.getElementById('airportContent').style.display = 'none';

  // Hide ISP panels
  document.getElementById('ispMobileEmpty').style.display = '';
  document.getElementById('ispMobileContent').style.display = 'none';
  document.getElementById('ispUnicomEmpty').style.display = '';
  document.getElementById('ispUnicomContent').style.display = 'none';
  document.getElementById('ispTelecomEmpty').style.display = '';
  document.getElementById('ispTelecomContent').style.display = 'none';
});

// Add province labels
const labelNames = {
  '110000':'北京','310000':'上海','320000':'江苏','330000':'浙江',
  '370000':'山东','440000':'广东'
};
const svg = document.getElementById('chinamap');
document.querySelectorAll('path.prov').forEach(path => {
  const code = path.dataset.adcode;
  const label = labelNames[code];
  if (!label) return;

  const bb = path.getBBox();
  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('class', 'provlabel');
  text.setAttribute('x', bb.x + bb.width / 2);
  text.setAttribute('y', bb.y + bb.height / 2);
  text.textContent = label;
  svg.appendChild(text);
});
</script>
