<title>省份详情</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap">

<style>
  :root {
    --bg: #F4F6FB; --bg-soft: #ECEEF6; --surface: #FFFFFF;
    --border: #DDE1EC; --border-soft: #E7E9F2;
    --text: #171B29; --text-muted: #5B6172; --text-faint: #8890A2;
    --accent: #3652E0; --accent-soft: #E8ECFF;
    --shadow: 0 1px 3px rgba(23,27,41,.05), 0 8px 24px -12px rgba(23,27,41,.12);
    --r: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0A0E1A; --bg-soft: #101527; --surface: #121729;
      --border: #232B42; --border-soft: #1B2136;
      --text: #E8EAF3; --text-muted: #A5ABC0; --text-faint: #6C7288;
      --accent: #6E8BFF; --accent-soft: #1B2450;
      --shadow: 0 1px 3px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.5);
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Noto Sans SC', "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 860px; margin: 0 auto; padding: 32px 24px 80px; }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-muted); text-decoration: none;
    margin-bottom: 24px; transition: color .12s;
  }
  .back:hover { color: var(--accent); }
  .page-header { margin-bottom: 32px; }
  .page-header h1 { font-size: 28px; font-weight: 700; margin: 0 0 4px; }
  .page-header p { margin: 0; font-size: 14px; color: var(--text-muted); }
  .rank-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 13px; font-weight: 700; padding: 4px 12px;
    border-radius: 20px; margin-bottom: 12px;
  }
  .content-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); box-shadow: var(--shadow); padding: 28px;
  }
  .content-card h2 { font-size: 18px; font-weight: 700; margin: 0 0 16px; }
  .placeholder-block {
    background: var(--bg-soft); border-radius: 8px; padding: 40px 24px;
    text-align: center; color: var(--text-faint); font-size: 14px; line-height: 1.8;
  }


.footer {
  background: var(--surface);
  border-top: 1px solid var(--border);
  margin-top: 80px;
}

.footer-content {
  max-width: 1400px;
  margin: 0 auto;
  padding: 60px 24px 40px;
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 40px;
}

.footer-section h4 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 16px;
}

.footer-brand .footer-logo {
  font-size: 24px;
  margin-bottom: 12px;
  font-family: 'Noto Sans SC', sans-serif;
}

.footer-desc {
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1.6;
  max-width: 400px;
}

.footer-links {
  list-style: none;
  padding: 0;
  margin: 0;
}

.footer-links li {
  margin-bottom: 12px;
}

.footer-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 14px;
  transition: color 0.2s;
}

.footer-links a:hover {
  color: var(--accent);
}

.footer-bottom {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px 24px 32px;
  border-top: 1px solid var(--border-soft);
}

.footer-disclaimer {
  margin-bottom: 20px;
}

.footer-disclaimer p {
  color: var(--text-faint);
  font-size: 13px;
  line-height: 1.6;
}

.footer-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.footer-meta p {
  color: var(--text-muted);
  font-size: 14px;
  margin: 0;
}

.footer-meta a {
  color: var(--accent);
  text-decoration: none;
  transition: color 0.2s;
}

.footer-meta a:hover {
  color: var(--accent-strong);
}

@media (max-width: 1024px) {
  .footer-content {
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }
}

@media (max-width: 640px) {
  .footer-content {
    grid-template-columns: 1fr;
    gap: 32px;
  }

  .footer-meta {
    flex-direction: column;
    align-items: flex-start;
  }
}

</style>

<div class="page">
  <a class="back" href="china-province-map.html">&#8592; 返回地图</a>

  <div class="page-header">
    <div class="rank-badge">
      <span>排名</span>
      <span id="rankNum">—</span>
    </div>
    <h1 id="provTitle">加载中…</h1>
    <p id="provSubtitle"></p>
  </div>

  <div class="content-card">
    <h2 id="contentTitle">详细内容</h2>
    <div class="placeholder-block">
      此处为详细内容占位符<br>
      后续可替换为实际数据
    </div>
  </div>
</div>

<script>
const PROVINCES = {
  '110000':'北京市','120000':'天津市','130000':'河北省','140000':'山西省',
  '150000':'内蒙古自治区','210000':'辽宁省','220000':'吉林省','230000':'黑龙江省',
  '310000':'上海市','320000':'江苏省','330000':'浙江省','340000':'安徽省',
  '350000':'福建省','360000':'江西省','370000':'山东省','410000':'河南省',
  '420000':'湖北省','430000':'湖南省','440000':'广东省','450000':'广西壮族自治区',
  '460000':'海南省','500000':'重庆市','510000':'四川省','520000':'贵州省',
  '530000':'云南省','540000':'西藏自治区','610000':'陕西省','620000':'甘肃省',
  '630000':'青海省','640000':'宁夏回族自治区','650000':'新疆维吾尔自治区',
  '710000':'台湾省','810000':'香港特别行政区','820000':'澳门特别行政区',
};

const params = new URLSearchParams(location.search);
const code = params.get('code') || '';
const rank = params.get('rank') || '';
const provName = PROVINCES[code] || '未知省份';

document.getElementById('provTitle').textContent = provName;
document.getElementById('rankNum').textContent = rank ? `#${rank}` : '—';
document.getElementById('provSubtitle').textContent = `Test ${rank} · ${provName}`;
document.getElementById('contentTitle').textContent = `Test ${rank}`;
document.title = `${provName} · 排名 #${rank}`;
</script>
